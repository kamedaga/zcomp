local L4 = require("L4")
local selected = arg[1] or "all"
local cases = {
  {name="dynamic", target="dynamic-hello", files="libraries", memory=2*1024*1024, process=true},
  {name="files", target="resources-linux", files="hidden", memory=256*1024},
  {name="pthread", target="pthread-linux", files="none", memory=256*1024, process=true},
  {name="db-full", target="dynamic-bypass", files="public", memory=2*1024*1024},
  {name="db-hide", target="dynamic-bypass", files="hidden", memory=2*1024*1024},
  {name="cap-ok", target="policy-linux", files="hidden", memory=256*1024, process=true, args={"all", "success"}},
  {name="no-out", target="policy-linux", files="none", output=false, args={"output", "EACCES"}},
  {name="no-file", target="policy-linux", files="none", args={"files", "EACCES"}},
  {name="low-mem", target="policy-linux", files="none", memory=64*1024, args={"memory", "ENOMEM"}},
  {name="no-mem", target="policy-linux", files="none", args={"memory", "EACCES"}},
  {name="no-proc", target="policy-linux", files="none", args={"process", "EACCES"}},
  {name="lo-proc", target="policy-linux", files="none", process=64*1024, args={"process", "ENOMEM"}},
  {name="bb-echo", target="busybox", files="libraries", memory=2*1024*1024, demo="busybox", args={"echo", "BusyBox-demo"}},
  {name="bb-cat", target="busybox", files="hidden", memory=2*1024*1024, demo="busybox", args={"cat", "public.txt"}},
  {name="bb-hide", target="busybox", files="libraries", memory=2*1024*1024, demo="busybox", args={"cat", "public.txt"}, status=1},
  {name="bb-secr", target="busybox", files="hidden", memory=2*1024*1024, demo="busybox", args={"cat", "secret.txt"}, status=1},
  {name="bb-full", target="busybox", files="public", memory=2*1024*1024, demo="busybox", args={"cat", "secret.txt"}},
  {name="bb-sha", target="busybox", files="hidden", memory=2*1024*1024, demo="busybox", args={"sha256sum", "public.txt"}},
  {name="bb-wc", target="busybox", files="hidden", memory=2*1024*1024, demo="busybox", args={"wc", "-c", "public.txt"}},
  {name="sq-mem", target="sqlite3", files="libraries", memory=8*1024*1024, demo="sqlite"},
  {name="sq-read", target="sqlite3", files="database", memory=8*1024*1024, demo="sqlite"}
}
if selected ~= "all" and selected ~= "dynamic" and selected ~= "bypass-dynamic"
   and selected ~= "busybox" and selected ~= "sqlite" then error("Unknown zcomp case: " .. selected) end

local function wanted(case)
  if case.demo then return selected == case.demo end
  return selected == "all" or selected == case.name
    or (selected == "bypass-dynamic" and case.target == "dynamic-bypass")
end

local tasks, expected, completed, failures = {}, 0, 0, 0
for _, case in ipairs(cases) do if wanted(case) then expected = expected + 1 end end

local function start(case)
  local name, target = case.name, case.target
  local sqlite = target == "sqlite3"
  -- 大きい配布ELFの読込みも起動枠へ課金し、一般の試験の権限やquotaは増やさない。
  local startup_quota = sqlite and 4*1024*1024 or 1024*1024
  local kernel_quota = case.process and 512*1024 or 256*1024
  -- 空のallowは追加のsub-factory等を制限する。Dataspace以外の生成まで禁止したとは主張しない。
  local memory = L4.Env.user_factory:create(L4.Proto.Factory, startup_quota, "allow="):m("rs")
  local factory = L4.Env.factory:create(L4.Proto.Factory, kernel_quota):m("rws")
  local scheduler = L4.default_loader:create_sched_proxy({
    prio_limit=2, prio_offset=0, cpus=L4.Cpu_set:new({0})
  }):m("rs")
  local rom = L4.default_loader:create_namespace({
    ["zcomp-run"]=L4.Env.rom:query("zcomp-run")():m("r"),
    [target]=L4.Env.rom:query(target)():m("r")
  }):m("r")
  local loader = L4.Loader.new({mem=memory, rm_fab=memory, factory=factory, default_caps={}})
  local caps = {rom=rom}
  if case.output ~= false then
    caps.linux_stdout = L4.Env.user_factory:create(L4.Proto.Log, name .. "-out", "green"):m("r")
  end
  if case.memory then
    caps.linux_memory = L4.Env.user_factory:create(L4.Proto.Factory, case.memory, "allow="):m("rs")
  end
  if case.process then
    -- 子を新しいnative環境から起動するため、このELFと家族単位の資源枠だけを追加する。
    caps.zcomp_binary = L4.Env.rom:query("zcomp-run")():m("r")
    local quota = case.process == true and 4*1024*1024 or case.process
    caps.linux_process = L4.Env.user_factory:create(L4.Proto.Factory, quota, "allow="):m("rs")
  end
  if case.files ~= "none" then
    local files = {}
    if case.files == "public" or case.files == "hidden" then
      files["public.txt"] = L4.Env.rom:query("public.txt")():m("r")
      if case.files == "public" then files["secret.txt"] = L4.Env.rom:query("secret.txt")():m("r") end
    end
    if target ~= "resources-linux" and target ~= "policy-linux" then
      local module = sqlite and "sqlite-musl" or target == "busybox" and "busybox-musl" or "ld-musl-x86_64.so.1"
      local libraries = {
        ["ld-musl-x86_64.so.1"]=L4.Env.rom:query(module)():m("r"),
        ["libc.so"]=L4.Env.rom:query(module)():m("r")
      }
      if case.demo then libraries["libc.musl-x86_64.so.1"] = L4.Env.rom:query(module)():m("r") end
      if sqlite then
        libraries["libreadline.so.8"] = L4.Env.rom:query("libreadline.so.8")():m("r")
        libraries["libncursesw.so.6"] = L4.Env.rom:query("libncursesw.so.6")():m("r")
        if case.files == "database" then files["sample.db"] = L4.Env.rom:query("sample.db")():m("r") end
      elseif target == "dynamic-bypass" then
        libraries["libzcomp-native.so"] = L4.Env.rom:query("libzcomp-native.so")():m("r")
      elseif target == "dynamic-hello" then
        libraries["libzcomp-example.so"] = L4.Env.rom:query("libzcomp-example.so")():m("r")
      end
      -- 起動ROMへのフォールバックは作らず、明示したファイルだけをLinuxパスへ公開する。
      files["lib"] = L4.default_loader:create_namespace(libraries):m("r")
    end
    caps.linux_files = L4.default_loader:create_namespace(files):m("r")
  end
  local environment = {caps=caps, scheduler=scheduler,
    log=L4.Env.user_factory:create(L4.Proto.Log, name, "yellow"):m("r")}
  print(string.format("[zcomp-policy] case=%s files=%s allocator_can_create_log=yes", name, case.files))
  local task
  if sqlite then
    local script = name == "sq-mem" and "sqlite-memory.sql" or "sqlite-query.sql"
    local input = assert(io.open("rom/" .. script, "r"))
    local sql = input:read("*a")
    input:close()
    -- ROMのDBは不変。共有ロックの未実装を成功扱いにせず、読み取り専用で比較する。
    task = loader:startv(environment, "rom/zcomp-run", "--audit-caps", "--immutable-files", "rom/sqlite3",
                         "-batch", "-noinit", name == "sq-mem" and ":memory:" or "file:/sample.db?immutable=1", sql)
  else
    local arguments = case.args or {}
    if target == "dynamic-bypass" then arguments = {"l4", case.files} end
    task = loader:startv(environment, "rom/zcomp-run", "--audit-caps", "--immutable-files", "rom/" .. target,
                         table.unpack(arguments))
  end
  task:exit_handler(function(status)
    print(string.format("[zcomp-result] case=%s status=%s", name, tostring(status)))
    completed = completed + 1
    if status ~= (case.status or 0) then failures = failures + 1 end
    if completed == expected then
      print(string.format("[zcomp-suite] complete cases=%d failed=%d", completed, failures))
    end
  end)
  tasks[#tasks+1] = task
end
for _, case in ipairs(cases) do if wanted(case) then start(case) end end
