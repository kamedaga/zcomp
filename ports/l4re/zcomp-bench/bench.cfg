local L4 = require("L4")
local files = L4.default_loader:create_namespace({
  ["public.txt"] = L4.Env.rom:query("public.txt")():m("r")
}):m("r")

local function start(guest, finished)
  local target = guest and "zcomp-run" or "zcomp-bench"
  local rom_files = { [target] = L4.Env.rom:query(target)():m("r") }
  if guest then rom_files["bench-linux"] = L4.Env.rom:query("bench-linux")():m("r") end
  local memory = L4.Env.user_factory:create(L4.Proto.Factory, 1024 * 1024, "allow="):m("rs")
  local loader = L4.Loader.new({mem = memory, rm_fab = memory,
    factory = L4.Env.factory:create(L4.Proto.Factory, 256 * 1024):m("rws"), default_caps = {}})
  local caps = {rom = L4.default_loader:create_namespace(rom_files):m("r")}
  if guest then
    caps.linux_stdout = L4.Env.user_factory:create(L4.Proto.Log, "benchout", "green"):m("r")
    caps.linux_files = files
    caps.linux_memory = L4.Env.user_factory:create(L4.Proto.Factory, 64 * 1024, "allow="):m("rs")
  else
    caps.bench_files = files
    caps.bench_memory = L4.Env.user_factory:create(L4.Proto.Factory, 64 * 1024, "allow="):m("rs")
  end
  local task = loader:start({caps = caps,
    log = L4.Env.user_factory:create(L4.Proto.Log, guest and "bench" or "native", "yellow"):m("r"),
    scheduler = L4.default_loader:create_sched_proxy({prio_limit = 2, prio_offset = 0,
      cpus = L4.Cpu_set:new({0})}):m("rs")},
    "rom/" .. target .. (guest and " --immutable-files rom/bench-linux" or ""))
  task:exit_handler(finished)
  return task
end

-- 通常の33ケースと同時実行せず、native対照の終了後にguestを起動する。
local native_task, guest_task
native_task = start(false, function(status)
  print(string.format("[zcomp-bench] native_status=%s", tostring(status)))
  if status == 0 then
    guest_task = start(true, function(guest_status)
      print(string.format("[zcomp-bench] complete status=%s", tostring(guest_status)))
    end)
  else print("[zcomp-bench] complete status=1") end
end)
